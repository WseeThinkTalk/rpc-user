syntax = "proto3";

package user;
option go_package = "./user";

// --------------------------- 用户基础服务 -----------------------------
service User {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc FindById(FindByIdRequest) returns (FindByIdResponse);
  rpc FindByMobile(FindByMobileRequest) returns (FindByMobileResponse);
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc UpgradePassword(UpgradePasswordRequest) returns (UpgradePasswordResponse);
  rpc AdminUserList(AdminUserListRequest) returns (AdminUserListResponse);
}

// --------------------------- 会员服务 -----------------------------
service Member {
  rpc MemberInfo(MemberInfoRequest) returns (MemberInfoResponse);
  rpc UpgradeMember(UpgradeMemberRequest) returns (UpgradeMemberResponse);
  rpc CheckMemberRight(CheckMemberRightRequest) returns (CheckMemberRightResponse);
  rpc MemberOrderList(MemberOrderListRequest) returns (MemberOrderListResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc PayCallback(PayCallbackRequest) returns (PayCallbackResponse);
}

// --------------------------- 社交关注服务 -----------------------------
service Follow {
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc UnFollow(UnFollowRequest) returns (UnFollowResponse);
  rpc FollowList(FollowListRequest) returns (FollowListResponse);
  rpc FansList(FansListRequest) returns (FansListResponse);
}

// ==================== User Messages ====================

message RegisterRequest {
  string username = 1;
  string mobile = 2;
  string avatar = 3;
  string password = 4;
}

message RegisterData {
  int64 userId = 1;
}

message RegisterResponse {
  int64 code = 1;
  string msg = 2;
  RegisterData data = 3;
}

message FindByIdRequest {
  int64 userId = 1;
}

message UserInfoData {
  int64 userId = 1;
  string username = 2;
  string mobile = 3;
  string avatar = 4;
  int64 role = 5;
  string displayId = 6;
  string bio = 7;
  int32 gender = 8;
  string profileCover = 9;
}

message FindByIdResponse {
  int64 code = 1;
  string msg = 2;
  UserInfoData data = 3;
}

message FindByMobileRequest {
  string mobile = 1;
}

message UserAuthData {
  int64 userId = 1;
  string username = 2;
  string mobile = 3;
  string avatar = 4;
  string password = 5;
  int64 role = 6;
}

message FindByMobileResponse {
  int64 code = 1;
  string msg = 2;
  UserAuthData data = 3;
}

message SendSmsRequest {
  int64 userId = 1;
  string mobile = 2;
}

message SendSmsResponse {
  int64 code = 1;
  string msg = 2;
}

message UpdateProfileRequest {
  int64 userId = 1;
  string username = 2;
  string avatar = 3;
  string bio = 4;
  int32 gender = 5;
  string profileCover = 6;
}

message UpdateProfileResponse {
  int64 code = 1;
  string msg = 2;
}

message UpgradePasswordRequest {
  int64 userId = 1;
  string passwordHash = 2;
}

message UpgradePasswordResponse {
  int64 code = 1;
  string msg = 2;
}

message AdminUserListRequest {
  string keyword = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
}

message AdminUserListData {
  repeated UserInfoData users = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message AdminUserListResponse {
  int64 code = 1;
  string msg = 2;
  AdminUserListData data = 3;
}

// ==================== Member Messages ====================

message MemberInfoRequest {
  int64 userId = 1;
}

message MemberInfoData {
  int64 userId = 1;
  int32 level = 2;
  string levelName = 3;
  int64 expireTime = 4;
  int32 status = 5;
}

message MemberInfoResponse {
  int64 code = 1;
  string msg = 2;
  MemberInfoData data = 3;
}

message UpgradeMemberRequest {
  int64 userId = 1;
  int32 level = 2;
  int32 durationDays = 3;
  string transactionId = 4;
  int64 amount = 5;
  string payChannel = 6;
}

message UpgradeMemberResponse {
  int64 code = 1;
  string msg = 2;
}

message CheckMemberRightRequest {
  int64 userId = 1;
  string rightKey = 2;
}

message CheckMemberRightData {
  bool hasRight = 1;
  int32 level = 2;
}

message CheckMemberRightResponse {
  int64 code = 1;
  string msg = 2;
  CheckMemberRightData data = 3;
}

message MemberOrderListRequest {
  int64 userId = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
}

message MemberOrderItem {
  int64 id = 1;
  int64 userId = 2;
  int32 level = 3;
  int32 durationDays = 4;
  int64 amount = 5;
  string payChannel = 6;
  int32 status = 7;
  int64 createTime = 8;
}

message MemberOrderListData {
  repeated MemberOrderItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message MemberOrderListResponse {
  int64 code = 1;
  string msg = 2;
  MemberOrderListData data = 3;
}

message CreateOrderRequest {
  int64 userId = 1;
  int32 level = 2;
  int32 durationDays = 3;
  int64 amount = 4;
  string payChannel = 5;
}

message CreateOrderData {
  string orderSn = 1;
  int64 amount = 2;
}

message CreateOrderResponse {
  int64 code = 1;
  string msg = 2;
  CreateOrderData data = 3;
}

message PayCallbackRequest {
  string orderSn = 1;
  string transactionId = 2;
}

message PayCallbackResponse {
  int64 code = 1;
  string msg = 2;
}

// ==================== Follow Messages ====================

message FollowRequest {
  int64 userId = 1;
  int64 followedUserId = 2;
}

message FollowResponse {
  int64 code = 1;
  string msg = 2;
}

message UnFollowRequest {
  int64 userId = 1;
  int64 followedUserId = 2;
}

message UnFollowResponse {
  int64 code = 1;
  string msg = 2;
}

message FollowListRequest {
  int64 id = 1;
  int64 userId = 2;
  int64 cursor = 3;
  int64 pageSize = 4;
}

message FollowItem {
  int64 id = 1;
  int64 followedUserId = 2;
  int64 fansCount = 3;
  int64 createTime = 4;
}

message FollowListData {
  repeated FollowItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
  int64 id = 4;
}

message FollowListResponse {
  int64 code = 1;
  string msg = 2;
  FollowListData data = 3;
}

message FansListRequest {
  int64 id = 1;
  int64 userId = 2;
  int64 cursor = 3;
  int64 pageSize = 4;
}

message FansItem {
  int64 id = 1;
  int64 userId = 2;
  int64 fansUserId = 3;
  int64 followCount = 4;
  int64 fansCount = 5;
  int64 createTime = 6;
}

message FansListData {
  repeated FansItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
  int64 id = 4;
}

message FansListResponse {
  int64 code = 1;
  string msg = 2;
  FansListData data = 3;
}
