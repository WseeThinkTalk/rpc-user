Name: follow.rpc
ListenOn: 0.0.0.0:8081
Timeout: 10000
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: follow.rpc
DB:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetime: 3600
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
KqPusherConf:
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Topic: thinktalk_notification
Telemetry:
  Endpoint: http://127.0.0.1:14268/api/traces
