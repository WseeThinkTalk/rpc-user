Name: member.rpc
ListenOn: 0.0.0.0:8091
Timeout: 10000
Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: member.rpc

DB:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
  MaxOpenConns: 10
  MaxIdleConns: 100
  MaxLifetime: 3600

BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
